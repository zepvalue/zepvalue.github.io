<footer class="site-footer">
  <div class="footer-inner">
    <span>© {{ site.time | date: '%Y' }} · {{ site.json.name | default: site.title }}</span>
    <span class="footer-links">
      {% if site.json.profiles.github %}<a href="{{ site.json.profiles.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.json.profiles.linkedin %}<a href="{{ site.json.profiles.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
      {% if site.json.profiles.x %}<a href="{{ site.json.profiles.x }}" target="_blank" rel="noopener">X</a>{% endif %}
      {% if site.json.contact.email %}<a href="mailto:{{ site.json.contact.email }}">Email</a>{% endif %}
    </span>
  </div>
</footer>
