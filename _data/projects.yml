# ── Projects: the deck on /apps/ and in the home page's right column ───────
# categories: display order and headings; each category is one deck panel.
# `short` is the tab label above the deck (falls back to `name`).
# A `featured` category gets large cards with a tinted monogram (`tint`) and an
# optional screenshot (`preview`, 1280x800 in /assets/previews/).
# npm projects: `npm_version` and `npm_downloads` are the fallback text; the
# home page replaces them with live numbers from npm.
# projects: one entry per card, in display order. `category` must match a
# category id. The first link is where the card goes, unless the project has
# `case_study: true` — then the card goes to /apps/<id>/, which must be a page
# in apps/<id>.md with `layout: case-study` and `project: <id>`.
# `meta` is split on " · " into platform chips. badge: founder | npm.

categories:
  - id: products
    name: Products
    note: Things people actually use.
    featured: true
  - id: open-source
    name: Open source
    note: Published packages on npm.
  - id: backend
    name: Backend &amp; infrastructure
    short: Backend
    note: APIs, serverless, and real-time systems.
  - id: web
    name: Web &amp; experiments
    short: Web
    note: Smaller builds across the stack.

projects:
